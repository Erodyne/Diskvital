name: Build e release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compila DiskVital
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v'); if ($v -notmatch '^\d+(\.\d+)*$') { $v = 'dev' }
          $out = "DiskVital-Setup-$v.exe"
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:$out /win32icon:DiskVital.ico /win32manifest:app.manifest `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll src\*.cs
          if (-not (Test-Path $out)) { throw 'Compilazione non riuscita' }
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  $out" | Set-Content "$out.sha256" -Encoding ascii
          "OUT=$out" | Out-File $env:GITHUB_ENV -Append
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" $env:OUT "$env:OUT.sha256" --title "DiskVital ${{ github.ref_name }}" --generate-notes
